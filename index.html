<!DOCTYPE html>
<html lang="en">
  <head>
   <meta charset="UTF-8">
    <meta name="description" content="A simple Mailto Link Generator">
    <meta name="author" content="Matthieu Solente">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="email, generator, html, css" />
    <link rel="stylesheet" type="text/css" href="css/style.css">
  <title>Mailto Link Generator</title>
  </head>
  <body>
    <header>
      <h1 class="title">Mailto Link Generator</h1>
    </header>
    <main class="wrapper">
      <article>
        
        <section id="mailToLink">
          <p><label for="linkTo">Adresse email</label></p>
          <p><input type="email" id="linkTo"></p>
          <p><label for="linkSubject">Objet</label></p>
          <p><input type="email" id="linkSubject"></p>
          <p><label for="linkBody">Contenu</label></p>
          <p><textarea type="email" id="linkBody" rows="7"></textarea></p>
          <div id="outputHTML" class="token"></div>
        </section>
         </article>
    </main>
<footer>
      <p>© Matthieu Solente <span id="year"></span> View on Github <a href="https://github.com/matthieuSolente/mail-to-link-generator"><img src="https://github.com/matthieuSolente/rename-your-file/blob/main/img/github-mark-white.png?raw=true" alt="my github page" style="width:20px"></a></p>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js" integrity="sha512-aVKKRRi/Q/YV+4mjoKBsE4x3H+BkegoM/em46NNlCqNTmUYADjBbeNefNxYV7giUp0VxICtqdrbqU7iVaeZNXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/script.js"></script>
  </body>
</html>
